# Local PostgreSQL and Elasticsearch for Rumba. Start with `docker compose up -d --wait`.
services:
  # Same version and credentials as the CI test job.
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: rumba
      POSTGRES_PASSWORD: rumba
      POSTGRES_DB: mdn
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumba -d mdn"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ES 9 matches the `elasticsearch` crate and the Dex deployer.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
